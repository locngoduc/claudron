version: 2
updates:
  # claudron has no runtime dependencies, but keep the dev/build toolchain
  # (build, twine, mkdocs-material, etc.) and pip itself current.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  # Keep the Actions used by ci.yml, release.yml and pages.yml pinned to
  # current, patched versions. Grouped so a routine batch of version bumps
  # lands as one PR instead of one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
