name: Feature request
description: Suggest something claudron should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that claudron makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: >
        Optional. A rough shape is fine - the problem matters more than the
        proposed solution.
