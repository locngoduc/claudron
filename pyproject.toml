[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "claudron"
# Single-sourced from src/claudron/__init__.py so a release bumps one line.
dynamic = ["version"]
description = "Align your Claude usage windows with your working day: schedule anchor messages, track real usage, never lose a reset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "claudron contributors" }]
keywords = ["claude", "claude-code", "usage", "rate-limit", "scheduler", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
dependencies = []

[project.optional-dependencies]
# Development only. claudron itself has no runtime dependencies; Pillow is
# needed solely to regenerate the logo assets with tools/make_logo.py.
dev = ["pillow>=10", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/locngoduc/claudron"
Issues = "https://github.com/locngoduc/claudron/issues"

[project.scripts]
claudron = "claudron.cli:main"

[tool.hatch.version]
path = "src/claudron/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claudron"]

[tool.hatch.build.targets.sdist]
# Everything needed to rebuild the project, including the packaging scripts
# and the artwork generator; nothing else.
include = [
  "src/claudron",
  "tests",
  "packaging",
  "tools",
  "docs",
  "assets",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "RELEASING.md",
  "SECURITY.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
